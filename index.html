<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Extract audio from videos privately in your browser." />
    <title>Audio Extractor</title>
  </head>

  <body>
    <main>
      <header>
        <h1>Audio Extractor</h1>
        <p>Extract original audio from videos without reencoding. Files stay on your device.</p>
      </header>

      <section aria-label="Audio extraction">
        <div class="drop-zone" id="drop-zone">
          <label for="files">Drop videos here or <u>choose files</u></label>
          <input
            id="files"
            type="file"
            accept="video/*,.mp4,.m4v,.mov,.mkv,.webm,.ts,.mts,.m2ts,.ogv"
            multiple
          />
        </div>

        <div id="extraction-details" class="extraction-details" hidden>
          <p id="notice" role="alert" hidden></p>

          <div id="activity" role="status" aria-live="polite" hidden>
            <div><span id="current-status">Idle</span></div>
            <progress
              id="batch-progress"
              max="1"
              value="0"
              aria-label="Overall batch progress"
            ></progress>
            <div>
              <span id="batch-status">No files added yet</span>
              <button id="download-all" type="button" hidden>Download all</button>
            </div>
          </div>

          <div id="jobs" class="jobs" aria-label="Files" hidden></div>

          <div class="controls" id="controls" hidden>
            <button id="run" type="button">Extract audio</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
